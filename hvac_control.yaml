# Bryant HVAC observer + manual raw UART diagnostic transmit
esphome:
  name: bryant-hvac
  friendly_name: Bryant HVAC
  project: 
    name: 'chatgpt.bryant-hvac'
    version: '3.23'
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: !secret hvac_atom_api_key

ota:
  - platform: esphome
    password: !secret hvac_atom_ota_password
    
# Wi-Fi settings
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret hvac_atom_static_ip
  power_save_mode: none
  
udp:
  id: syslog_udp
  addresses: 192.168.0.7
  port: 514

syslog:
  id: syslog_hvac
  udp_id: syslog_udp
  time_id: sntp_time
  port: 514
  level: INFO

logger:
  level: DEBUG
  baud_rate: 0

# SNTP Time Source
time:
  - platform: sntp
    id: sntp_time
    servers: 
      - 129.6.15.28
    timezone: "EST5EDT,M3.2.0,M11.1.0" #America/New_York
    on_time_sync: 
      then:
        - logger.log: "SNTP time synced"

external_components:
  - source:
      type: git
      url: https://github.com/natabled/bryantHVAC
    components: [bryant_framer, bryant_parser, bryant_writer, bryant_set]
    refresh: 24h

uart:
  id: hvac_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 8192

bryant_framer:
  id: hvac_framer
  uart_id: hvac_uart
  drain_interval: 7ms
  ring_buffer_size: 2048
  max_payload_length: 200
  log_valid_frames: true
  log_frame_errors: true

# Numeric sensors preserve v2.01 IDs; the combined date-time is local ISO text.
sensor:
  - platform: copy
    source_id: m212063b02f14
    id: hvac_indoor_c
    internal: true
    filters:
      - lambda: return (x - 32.0f) * (5.0f / 9.0f);
  - platform: template
    id: m212063b02f14
    name: Indoor Temperature
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: m212063b02f33
    name: HVAC Mode Raw
    accuracy_decimals: 0
  - platform: template
    id: m212063b03f23
    name: HVAC Heat Setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: heat_pump_state
    name: Heat Pump State
    accuracy_decimals: 0
  - platform: template
    id: hvac_hour
    name: HVAC Hour
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_minute
    name: HVAC Minute
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_second
    name: HVAC Second
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_day
    name: HVAC Day
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_month
    name: HVAC Month
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_year
    name: HVAC Year (2-digit)
    internal: true
    accuracy_decimals: 0

  - platform: template
    id: hvac_cool_setpoint
    name: HVAC Cool Setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

  - platform: template
    id: hvac_fan_mode_raw
    name: HVAC Fan Mode Raw
    accuracy_decimals: 0

  - platform: template
    id: hvac_fan_speed_raw
    name: HVAC Fan Speed Raw
    accuracy_decimals: 0

  - platform: template
    id: hvac_zones_holding_raw
    name: HVAC Zones Holding Raw
    accuracy_decimals: 0

  - platform: template
    id: hvac_timed_holds_raw
    name: HVAC Timed Holds Raw
    accuracy_decimals: 0

  - platform: template
    id: hvac_hold_duration_raw
    name: HVAC Hold Duration Raw
    accuracy_decimals: 0

  - platform: debug
    free:
      name: Atom Free Heap
    block:
      name: Atom Max Free Heap Block
    loop_time:
      name: Atom Loop Time
  - platform: uptime
    name: Atom Uptime
    type: seconds

text_sensor:
  - platform: template
    id: hvac_datetime
    name: HVAC Date and Time
    icon: mdi:calendar-clock
  - platform: template
    id: hvac_set_status
    name: HVAC Setpoint Transaction Status
    icon: mdi:check-circle-outline
  - platform: debug
    reset_reason:
      name: Atom Reset Reason

bryant_parser:
  id: hvac_parser
  framer_id: hvac_framer
  datetime_text_id: hvac_datetime
  log_matches: true
  log_unmatched: false
  messages:
    - name: thermostat_time
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0202}
      payload_min: 6
    - name: thermostat_date
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0203}
      payload_min: 6
    - name: thermostat_status
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B02}
      payload_min: 26
    - name: thermostat_heat_setpoint
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B03}
      payload_min: 43
    - name: heat_pump_stage
      match: {dst: 0x20, src: 0x50, function: 0x06, register: 0x3E02}
      payload_min: 4
  fields:
    - {name: indoor_temp, message: thermostat_status, sensor_id: m212063b02f14, offset: 6}
    - {name: hvac_mode, message: thermostat_status, sensor_id: m212063b02f33, offset: 25}
    - {name: heat_setpoint, message: thermostat_heat_setpoint, sensor_id: m212063b03f23, offset: 15}
    - name: heat_pump_stage
      message: heat_pump_stage
      sensor_id: heat_pump_state
      offset: 3
      bit_rules:
        - {mask: 0x04, value: 2}
        - {mask: 0x02, value: 1}
      default: 0
    - {name: hour, message: thermostat_time, sensor_id: hvac_hour, offset: 3}
    - {name: minute, message: thermostat_time, sensor_id: hvac_minute, offset: 4}
    - {name: second, message: thermostat_time, sensor_id: hvac_second, offset: 5}
    - {name: day, message: thermostat_date, sensor_id: hvac_day, offset: 3}
    - {name: month, message: thermostat_date, sensor_id: hvac_month, offset: 4}
    - {name: year, message: thermostat_date, sensor_id: hvac_year, offset: 5}
    # Register 3B03 — zone 1
    - {name: cool_setpoint, message: thermostat_heat_setpoint, sensor_id: hvac_cool_setpoint, offset: 23}
    - {name: fan_mode, message: thermostat_heat_setpoint, sensor_id: hvac_fan_mode_raw, offset: 6}
    - {name: fan_speed, message: thermostat_heat_setpoint, sensor_id: hvac_fan_speed_raw, offset: 39}
    - {name: zones_holding, message: thermostat_heat_setpoint, sensor_id: hvac_zones_holding_raw, offset: 14}
    - {name: timed_holds, message: thermostat_heat_setpoint, sensor_id: hvac_timed_holds_raw, offset: 40}
    # First byte of zone 1 hold duration (MSB).
    - {name: hold_duration_high, message: thermostat_heat_setpoint, sensor_id: hvac_hold_duration_raw, offset: 41}
    

# Read-only date/time is published by bryant_parser to text_sensor.hvac_datetime.
# Native datetime template with lambda is not used because it expects a writable
# or optimistic configuration. The six raw date/time sensors stay internal.

bryant_writer:
  id: hvac_writer
  uart_id: hvac_uart
  framer_id: hvac_framer
  idle_ms: 50
  poll_interval: 50s
  log_tx: true
  polls:
    - name: thermostat_status
      frame: "20 01 92 01 03 00 00 0B 00 3B 02 2D 7A"
      offset_ms: 0
    - name: thermostat_heat_setpoint
      frame: "20 01 92 01 03 00 00 0B 00 3B 03 EC BA"
      offset_ms: 350

# Setpoint transactions: fresh 3B03 read -> write -> verify.
# No automatic write retries. Climate remains monitor-only for initial testing.
bryant_set:
  id: hvac_set
  framer_id: hvac_framer
  writer_id: hvac_writer
  status_text_id: hvac_set_status
  thermostat_address: 0x20
  sam_address: 0x92
  timeout: 15s
  verify_delay: 500ms

number:
  - platform: template
    id: zone1_heat_request
    name: Zone 1 Heat Request
    min_value: 50
    max_value: 90
    step: 1
    unit_of_measurement: "°F"
    optimistic: true
    initial_value: 66
    restore_value: false

# Observational climate entity: frontend commands are ignored; nothing is sent.
climate:
  - platform: template
    id: bryant_climate
    name: Bryant HVAC
    sensor: hvac_indoor_c
    supported_modes: ["OFF", HEAT, COOL, AUTO]
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 10 # 50F
      max_temperature: 30 # 86F
      temperature_step: 0.555 # 1F
    on_control:
      - logger.log: "Bryant climate is monitor-only; control ignored"
    initial_state:
      mode: "OFF"

# Read-only climate state reflects the parsed target.
# Avoid assigning a heating/cooling action until raw mode codes are confirmed.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return !isnan(id(m212063b03f23).state);'
          then:
            - climate.template.publish:
                id: bryant_climate
                target_temperature: !lambda 'return (id(m212063b03f23).state - 32.0f) * (5.0f / 9.0f);'

# Manual raw-hex diagnostic transmission (CRC and length verified by writer).
# Disabled by default; turn on the switch deliberately before pressing the button.
text:
  - platform: template
    id: hvac_tx_hex
    name: HVAC Raw TX Hex
    mode: text
    optimistic: true
    max_length: 250
  - platform: template
    id: log_observer
    name: Log Observer
    mode: TEXT
    optimistic: true
    max_length: 128
    on_value:
      then:
        - logger.log:
            format: "OBSERVER %s"
            args: ["x.c_str()"]
            
switch:
  - platform: template
    id: hvac_tx_enabled
    name: HVAC Manual TX Enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

button:
  - platform: template
    name: Send Zone 1 Heat Setpoint
    on_press:
      - lambda: |-
          id(hvac_set).set_heat(1, static_cast<uint8_t>(id(zone1_heat_request).state));
  - platform: template
    name: HVAC Send Raw Frame
    on_press:
      - lambda: |-
          if (!id(hvac_tx_enabled).state) {
            ESP_LOGW("hvac_tx", "TX blocked: manual transmit disabled");
            return;
          }
          const bool accepted = id(hvac_writer).enqueue_hex(id(hvac_tx_hex).state);
          if (accepted) {
            ESP_LOGI("hvac_tx", "Manual frame queued; awaiting bus idle");
            id(hvac_tx_enabled).turn_off();
          }

debug:
  update_interval: 30s

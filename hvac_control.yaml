# Bryant HVAC observer + manual raw UART diagnostic transmit
esphome:
  name: bryant-hvac
  friendly_name: HVAC
  project: 
    name: 'chatgpt.bryant-hvac'
    version: '3.38'
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: !secret hvac_atom_api_key

ota:
  - platform: esphome
    password: !secret hvac_atom_ota_password
    
# Wi-Fi settings
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret hvac_atom_static_ip
  power_save_mode: none
  
udp:
  id: syslog_udp
  addresses: !secret syslog_ip
  port: !secret syslog_port

syslog:
  id: syslog_hvac
  udp_id: syslog_udp
  time_id: sntp_time
  port: 514
  level: DEBUG
  
select:
  - platform: template
    name: "Log Level"
    id: log_level_select
    icon: mdi:bug
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    options:
      - "NONE"
      - "ERROR"
      - "WARN"
      - "INFO"
      - "DEBUG"
    initial_option: "DEBUG"
    set_action:
      - lambda: |-
          int level = ESPHOME_LOG_LEVEL_DEBUG;

          if (x == "NONE") level = ESPHOME_LOG_LEVEL_NONE;
          else if (x == "ERROR") level = ESPHOME_LOG_LEVEL_ERROR;
          else if (x == "WARN") level = ESPHOME_LOG_LEVEL_WARN;
          else if (x == "INFO") level = ESPHOME_LOG_LEVEL_INFO;
          else if (x == "DEBUG") level = ESPHOME_LOG_LEVEL_DEBUG;
          else if (x == "VERBOSE") level = ESPHOME_LOG_LEVEL_VERBOSE;
          else if (x == "VERY_VERBOSE") level = ESPHOME_LOG_LEVEL_VERY_VERBOSE;

          // Syslog has no public runtime setter; suppress messages at the source.
          // Syslog forwarding remains capped by syslog.level: DEBUG.
          id(hvac_logger).set_log_level(level);

logger:
  id: hvac_logger
  level: DEBUG
  baud_rate: 0

# SNTP Time Source
time:
  - platform: sntp
    id: sntp_time
    servers: 
      - 129.6.15.28
    timezone: "EST5EDT,M3.2.0,M11.1.0" #America/New_York
    on_time_sync: 
      then:
        - logger.log: "SNTP time synced"

external_components:
  - source:
      type: git
      url: https://github.com/natabled/bryantHVAC
    components: [bryant_framer, bryant_parser, bryant_writer, bryant_set]
    refresh: 24h #always
    
uart:
  id: hvac_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 8192

bryant_framer:
  id: hvac_framer
  uart_id: hvac_uart
  drain_interval: 7ms
  ring_buffer_size: 2048
  max_payload_length: 200
  log_valid_frames: true
  log_frame_errors: true
  sync_timeout: 250ms
  sync_restarts_id: hvac_sync_restarts
  sync_acquisitions_id: hvac_sync_acquisitions
  sync_state_id: hvac_sync_state

# Numeric sensors preserve v2.01 IDs; the combined date-time is local ISO text.
sensor:
  - platform: copy
    source_id: m212063b02f14
    id: indoor_temp_c
    internal: true
    filters:
      - lambda: return (x - 32.0f) * (5.0f / 9.0f);
  - platform: template
    id: m212063b02f14
    name: Indoor Temperature
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: m212063b02f33
    name: Mode Raw
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: m212063b03f23
    name: Heat Setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: heat_pump_state
    name: Heat Pump State Raw
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_hour
    name: Hour
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_minute
    name: Minute
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_second
    name: Second
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_day
    name: Day
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_month
    name: Month
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_year
    name: Year
    internal: true
    accuracy_decimals: 0

  - platform: template
    id: hvac_cool_setpoint
    name: Cool Setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

  - platform: template
    id: hvac_fan_mode_raw
    name: Fan Mode Raw
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_fan_speed_raw
    name: Fan Speed Raw Unverified
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_zones_holding_raw
    name: Hold Bitmask
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_timed_holds_raw
    name: Timed Override Bitmask
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_hold_duration_raw
    name: Override Minutes
    unit_of_measurement: min
    icon: mdi:timer-outline
    accuracy_decimals: 0

  - platform: debug
    free:
      name: Atom Free Heap
    block:
      name: Atom Max Free Heap Block
    loop_time:
      name: Atom Loop Time
  - platform: uptime
    name: Atom Uptime
    type: seconds

  - platform: template
    id: hvac_sync_restarts
    name: "Framer Sync Restarts"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_sync_acquisitions
    name: "Framer Sync Acquisitions"
    accuracy_decimals: 0
    entity_category: diagnostic

  - platform: template
    id: hvac_sync_state
    name: "Framer Synchronized"
    accuracy_decimals: 0
    entity_category: diagnostic

binary_sensor:
  - platform: template
    id: hvac_zone1_permanent_hold
    name: "Permanent Hold"
    icon: mdi:hand-back-right
    lambda: |-
      if (isnan(id(hvac_zones_holding_raw).state)) return {};
      return (static_cast<uint8_t>(id(hvac_zones_holding_raw).state) & 0x01) != 0;
    entity_category: diagnostic

  - platform: template
    id: hvac_zone1_timed_override
    name: "Timed Override"
    icon: mdi:timer
    lambda: |-
      if (isnan(id(hvac_timed_holds_raw).state)) return {};
      return (static_cast<uint8_t>(id(hvac_timed_holds_raw).state) & 0x01) != 0;
    entity_category: diagnostic
    
text_sensor:
  - platform: template
    id: hvac_selected_mode
    entity_category: diagnostic
    name: "Thermostat Mode"
    icon: mdi:hvac
    lambda: |-
      if (isnan(id(m212063b02f33).state)) return {"UNKNOWN"};
      switch (static_cast<int>(id(m212063b02f33).state)) {
        case 0: return {"HEAT"};
        case 1: return {"COOL"};
        case 5: return {"OFF"};
        default: return {"UNKNOWN"};
      }
  - platform: template
    id: hvac_zone1_fan_mode
    entity_category: diagnostic
    name: "Fan Mode"
    icon: mdi:fan
    lambda: |-
      if (isnan(id(hvac_fan_mode_raw).state)) return {"UNKNOWN"};
      switch (static_cast<int>(id(hvac_fan_mode_raw).state)) {
        case 0: return {"AUTO"};
        case 1: return {"LOW"};
        case 2: return {"MED"};
        case 3: return {"HIGH"}; // Expected sequence; not yet captured in 3B03.
        default: return {"UNKNOWN"};
      }
  - platform: template
    id: hvac_datetime
    name: Date and Time
    icon: mdi:calendar-clock
  - platform: template
    id: hvac_set_status
    name: Set Transaction Status
    icon: mdi:check-circle-outline
  - platform: debug
    reset_reason:
      name: Atom Reset Reason

bryant_parser:
  id: hvac_parser
  framer_id: hvac_framer
  datetime_text_id: hvac_datetime
  log_matches: true
  log_unmatched: false
  messages:
    - name: thermostat_time
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0202}
      payload_min: 6
    - name: thermostat_date
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0203}
      payload_min: 6
    - name: thermostat_status
      log: true
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B02}
      payload_min: 26
    - name: thermostat_heat_setpoint
      log: true
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B03}
      payload_min: 43
    - name: heat_pump_stage
      log: false
      match: {dst: 0x20, src: 0x50, function: 0x06, register: 0x3E02}
      payload_min: 4
  fields:
    - {name: indoor_temp, message: thermostat_status, sensor_id: m212063b02f14, offset: 6}
    # 3B02 data byte 22: HEAT=0, COOL=1, OFF=5 (AUTO not established).
    - {name: selected_mode, message: thermostat_status, sensor_id: m212063b02f33, offset: 25}
    - {name: heat_setpoint, message: thermostat_heat_setpoint, sensor_id: m212063b03f23, offset: 15}
    - name: heat_pump_stage
      message: heat_pump_stage
      sensor_id: heat_pump_state
      offset: 3
      bit_rules:
        - {mask: 0x04, value: 2}
        - {mask: 0x02, value: 1}
      default: 0
    - {name: hour, message: thermostat_time, sensor_id: hvac_hour, offset: 3}
    - {name: minute, message: thermostat_time, sensor_id: hvac_minute, offset: 4}
    - {name: second, message: thermostat_time, sensor_id: hvac_second, offset: 5}
    - {name: day, message: thermostat_date, sensor_id: hvac_day, offset: 3}
    - {name: month, message: thermostat_date, sensor_id: hvac_month, offset: 4}
    - {name: year, message: thermostat_date, sensor_id: hvac_year, offset: 5}
    # Register 3B03 — zone 1
    - {name: cool_setpoint, message: thermostat_heat_setpoint, sensor_id: hvac_cool_setpoint, offset: 23}
    - {name: fan_mode, message: thermostat_heat_setpoint, sensor_id: hvac_fan_mode_raw, offset: 6}
    - {name: fan_speed, message: thermostat_heat_setpoint, sensor_id: hvac_fan_speed_raw, offset: 39}
    - {name: zones_holding, message: thermostat_heat_setpoint, sensor_id: hvac_zones_holding_raw, offset: 14}
    - {name: timed_holds, message: thermostat_heat_setpoint, sensor_id: hvac_timed_holds_raw, offset: 40}
    # 3B03 zone 1 remaining override minutes: BE uint16 at data offsets 38-39.
    - {name: override_minutes, message: thermostat_heat_setpoint, sensor_id: hvac_hold_duration_raw, offset: 41, width: 16, endian: big}
    

# Read-only date/time is published by bryant_parser to text_sensor.hvac_datetime.
# Native datetime template with lambda is not used because it expects a writable
# or optimistic configuration. The six raw date/time sensors stay internal.

bryant_writer:
  id: hvac_writer
  uart_id: hvac_uart
  framer_id: hvac_framer
  idle_ms: 50
  poll_interval: 50s
  log_tx: true
  responder:
    enabled: true
    address: 0x92
    register: 0x3B0E
    window: 5s
  polls:
    - name: thermostat_status
      frame: "20 01 92 01 03 00 00 0B 00 3B 02 2D 7A"
      offset_ms: 0
    - name: thermostat_heat_setpoint
      frame: "20 01 92 01 03 00 00 0B 00 3B 03 EC BA"
      offset_ms: 350

# Setpoint transactions: fresh 3B03 read -> write -> verify.
# No automatic write retries. Climate remains monitor-only for initial testing.
bryant_set:
  id: hvac_set
  framer_id: hvac_framer
  writer_id: hvac_writer
  status_text_id: hvac_set_status
  thermostat_address: 0x20
  sam_address: 0x92
  timeout: 15s
  verify_delay: 500ms

number:
  - platform: template
    id: zone1_heat_request
    name: Heat Test Request
    min_value: 50
    max_value: 90
    step: 1
    unit_of_measurement: "°F"
    optimistic: true
    initial_value: 66
    restore_value: false
  - platform: template
    id: auto_set
    name: "Auto Setpoint"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°F"
    device_class: temperature
    entity_category: config
    min_value: 50
    max_value: 86
    step: 1
    optimistic: false
    update_interval: 5s

    lambda: |-
      return id(m212063b03f23).state;

    set_action:
      - lambda: |-
          if (id(bryant_climate).mode != climate::CLIMATE_MODE_AUTO) {
            ESP_LOGW("atom_climate",
                     "AUTO setpoint ignored: climate is not in AUTO");
            return;
          }

          if (id(hvac_set).is_busy()) {
            ESP_LOGW("atom_climate",
                     "AUTO setpoint ignored: transaction busy");
            return;
          }

          if (isnan(id(m212063b02f33).state) ||
            static_cast<int>(id(m212063b02f33).state) != 0) {
            ESP_LOGW("atom_climate",
                     "AUTO override rejected: thermostat not in HEAT");
            return;
          }

          if (id(hvac_zone1_permanent_hold).state) {
            ESP_LOGW("atom_climate",
                     "AUTO override rejected: permanent HOLD active");
            return;
          }
          
          const int target = static_cast<int>(lroundf(x));

          ESP_LOGI("atom_climate",
                   "AUTO override requested: %dF", target);

          if (!id(hvac_set).set_heat(1, static_cast<uint8_t>(target))) {
            ESP_LOGW("atom_climate",
                     "AUTO override request rejected");
          }

# Atom climate policy is separate from the thermostat's selected HVAC mode.
# OFF = thermostat reports mode 0x05 (not an Atom command).
# AUTO = thermostat in HEAT/COOL; Atom observes and can request a temporary heat override.
# HEAT = Atom owns a permanent HOLD while thermostat is selected HEAT.
# COOL = reserved: no verified cool-setpoint writer yet; requests fall back to AUTO.
# Never restore Atom ownership on reboot or adopt a manual HOLD.
globals:
  - id: atom_policy
    type: int
    restore_value: no
    initial_value: '0'  # 0 OFF, 1 AUTO, 2 HEAT; COOL reserved
  - id: atom_owned_hold
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_hold_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_hold_requested_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: atom_release_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_target_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_target_f
    type: int
    restore_value: no
    initial_value: '66'
  - id: atom_last_hold_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: atom_last_hold_seen
    type: bool
    restore_value: no
    initial_value: 'false'

climate:
  - platform: template
    id: bryant_climate
    name: Bryant Climate
    sensor: indoor_temp_c
    supported_modes: ["OFF", AUTO, HEAT, COOL]
    supports_current_temperature: true
    supports_two_point_target_temperature: false
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 10  # 50F
      max_temperature: 30  # 86F
      temperature_step: 1
    initial_state:
      mode: "OFF"
    on_control:
      - lambda: |-
          const float raw = id(m212063b02f33).state;
          const int thermostat_mode = isnan(raw) ? -1 : static_cast<int>(raw);
          if (x.get_mode().has_value()) {
            const auto requested = x.get_mode().value();
            if (requested == climate::CLIMATE_MODE_HEAT) {
              if (thermostat_mode != 0) {
                ESP_LOGW("atom_climate", "HEAT requires thermostat selected HEAT; no thermostat mode-write implemented");
              } else if (id(atom_policy) != 2) {
                id(atom_policy) = 2;
                id(atom_hold_pending) = false;
                id(atom_target_pending) = false;
                // A pre-existing manual HOLD remains manual; only our transaction can establish ownership.
                ESP_LOGI("atom_climate", "HEAT selected: request Atom-owned HOLD");
              }
            } else if (requested == climate::CLIMATE_MODE_AUTO) {
              if (thermostat_mode == 0 || thermostat_mode == 1) {
                if (id(atom_policy) == 2 && id(atom_owned_hold)) id(atom_release_pending) = true;
                id(atom_policy) = 1;
                id(atom_hold_pending) = false;
                id(atom_target_pending) = false;
                ESP_LOGI("atom_climate", "AUTO selected: observing thermostat");
              } else {
                ESP_LOGW("atom_climate", "AUTO requires thermostat HEAT or COOL");
              }
            } else if (requested == climate::CLIMATE_MODE_OFF) {
              // Mode 0x05 is a physical thermostat setting, NOT an Atom-control disable.
              // No verified 3B02 mode-write exists. Never claim to turn the thermostat off.
              ESP_LOGW("atom_climate", "OFF requires thermostat mode 0x05; mode writing not implemented");
            } else if (requested == climate::CLIMATE_MODE_COOL) {
              ESP_LOGW("atom_climate", "COOL reserved: cool setpoint write not implemented");
            }
          }
          if (x.get_target_temperature().has_value()) {
            const int f = static_cast<int>(lroundf(x.get_target_temperature().value() * 9.0f / 5.0f + 32.0f));
            if (f >= 50 && f <= 86 && thermostat_mode == 0 &&
                (id(atom_policy) == 1 || id(atom_policy) == 2) &&
                !(id(atom_policy) == 1 &&
                  (isnan(id(hvac_zones_holding_raw).state) ||
                   (static_cast<uint8_t>(id(hvac_zones_holding_raw).state) & 1)))) {
              // In AUTO, set_heat() while not on permanent HOLD produces the thermostat's
              // default temporary override (observed ~120 minutes). In HEAT it preserves HOLD.
              id(atom_target_f) = f;
              id(atom_target_pending) = true;
              ESP_LOGI("atom_climate", "Queued %s heat target %dF", id(atom_policy) == 1 ? "AUTO override" : "HOLD", f);
            } else {
              ESP_LOGW("atom_climate", "Setpoint rejected: only HEAT-selected thermostat supported by writer");
            }
          }

# Reconcile from *fresh* parser values, not merely a 5s timer. No write retries.
# Polls of 3B02/3B03 remain 50s; changing the manual HOLD may take one poll to appear.
interval:
  - interval: 5s
    then:
      - lambda: |-
          const float mode_raw = id(m212063b02f33).state;
          const int tmode = isnan(mode_raw) ? -1 : static_cast<int>(mode_raw);
          const bool have_hold = !isnan(id(hvac_zones_holding_raw).state);
          const bool hold = have_hold && ((static_cast<uint8_t>(id(hvac_zones_holding_raw).state) & 1) != 0);
          const bool timed = !isnan(id(hvac_timed_holds_raw).state) &&
              ((static_cast<uint8_t>(id(hvac_timed_holds_raw).state) & 1) != 0);
          const bool busy = id(hvac_set).is_busy();
          // Startup/observation: OFF if thermostat OFF; AUTO if HEAT or COOL.
          // Unknown mode never implies permission to write.
          if (tmode == 5) {
            if (id(atom_policy) == 2) {
              ESP_LOGW("atom_climate", "Thermostat turned OFF; Atom relinquishing control");
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
              id(atom_release_pending) = false;
            }
            id(atom_policy) = 0;
          } else if (tmode == 0 || tmode == 1) {
            if (id(atom_policy) == 0) id(atom_policy) = 1;
            if (id(atom_policy) == 2 && tmode != 0) {
              ESP_LOGW("atom_climate", "Thermostat left HEAT; Atom relinquishing control");
              id(atom_policy) = 1;
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
              id(atom_release_pending) = false;
            }
          }
          if (id(atom_policy) == 2 && tmode == 0 && have_hold && !busy) {
            if (id(atom_owned_hold) && (!hold || timed)) {
              ESP_LOGW("atom_climate", "Operator removed/changed Atom HOLD; returning to AUTO");
              id(atom_policy) = 1;
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
            } else if (id(atom_hold_pending)) {
              if (hold && !timed) {
                id(atom_owned_hold) = true;
                id(atom_hold_pending) = false;
                ESP_LOGI("atom_climate", "Atom HOLD confirmed");
              } else if ((uint32_t)(millis() - id(atom_hold_requested_at)) > 20000) {
                ESP_LOGW("atom_climate", "HOLD not confirmed; returning to AUTO");
                id(atom_policy) = 1;
                id(atom_hold_pending) = false;
                id(atom_target_pending) = false;
              }
            } else if (!id(atom_owned_hold)) {
              if (hold && !timed) {
                // Do not silently adopt an operator's pre-existing manual HOLD.
                ESP_LOGW("atom_climate", "Manual HOLD already active; Atom ownership not established; returning to AUTO");
                id(atom_policy) = 1;
                id(atom_target_pending) = false;
              } else if (id(hvac_set).set_hold(1, true)) {
                id(atom_hold_pending) = true;
                id(atom_hold_requested_at) = millis();
              }
            }
          }
          if (id(atom_release_pending) && !busy && have_hold) {
            if (hold && id(atom_owned_hold)) {
              if (id(hvac_set).set_hold(1, false)) id(atom_release_pending) = false;
            } else id(atom_release_pending) = false;
            id(atom_owned_hold) = false;
          }
          if (id(atom_target_pending) && !busy && tmode == 0 &&
              (id(atom_policy) == 1 || (id(atom_policy) == 2 && id(atom_owned_hold))) &&
              !(id(atom_policy) == 1 && (!have_hold || hold))) {
            if (id(hvac_set).set_heat(1, static_cast<uint8_t>(id(atom_target_f)))) {
              id(atom_target_pending) = false;
            }
          }
      - climate.template.publish:
          id: bryant_climate
          mode: !lambda |-
            switch (id(atom_policy)) {
              case 2: return climate::CLIMATE_MODE_HEAT;
              case 1: return climate::CLIMATE_MODE_AUTO;
              default: return climate::CLIMATE_MODE_OFF;
            }
          target_temperature: !lambda |-
            const float f = id(m212063b03f23).state;
            return isnan(f) ? NAN : (f - 32.0f) * 5.0f / 9.0f;

# Manual raw-hex diagnostic transmission (CRC and length verified by writer).
# Disabled by default; turn on the switch deliberately before pressing the button.
text:
  - platform: template
    id: hvac_tx_hex
    name: Raw TX Hex
    mode: text
    optimistic: true
    max_length: 250
  - platform: template
    id: log_observer
    name: Log Observer
    mode: TEXT
    optimistic: true
    max_length: 128
    on_value:
      then:
        - logger.log:
            format: "OBSERVER %s"
            args: ["x.c_str()"]
            
switch:
  - platform: template
    id: hvac_tx_enabled
    name: Manual TX Enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

button:
  - platform: template
    name: Hold Set
    on_press:
      - lambda: |-
          id(hvac_set).set_hold(1, true);
  - platform: template
    name: Hold Clear
    on_press:
      - lambda: |-
          id(hvac_set).set_hold(1, false);
  - platform: template
    name: Heat Test Send
    on_press:
      - lambda: |-
          id(hvac_set).set_heat(1, static_cast<uint8_t>(id(zone1_heat_request).state));
  - platform: template
    name: Raw TX Send
    on_press:
      - lambda: |-
          if (!id(hvac_tx_enabled).state) {
            ESP_LOGW("hvac_tx", "TX blocked: manual transmit disabled");
            return;
          }
          const bool accepted = id(hvac_writer).enqueue_hex(id(hvac_tx_hex).state);
          if (accepted) {
            ESP_LOGI("hvac_tx", "Manual frame queued; awaiting bus idle");
            id(hvac_tx_enabled).turn_off();
          }

debug:
  update_interval: 30s

# Bryant HVAC observer + manual raw UART diagnostic transmit
esphome:
  name: bryant-hvac
  friendly_name: Bryant HVAC
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: !secret hvac_atom_api_key

ota:
  - platform: esphome
    password: !secret hvac_atom_ota_password
    
# Wi-Fi settings
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret hvac_atom_static_ip
  power_save_mode: none
  
logger:
  level: DEBUG
  baud_rate: 0

external_components:
  - source:
      type: git
      type: local
      path: ./components
    components: [bryant_framer, bryant_parser]

uart:
  id: hvac_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 8192

bryant_framer:
  id: hvac_framer
  uart_id: hvac_uart
  drain_interval: 7ms
  ring_buffer_size: 2048
  max_payload_length: 200
  log_valid_frames: true
  log_frame_errors: true

# Numeric sensors preserve v2.01 IDs; the combined date-time is local ISO text.
sensor:
  - platform: copy
    source_id: m212063b02f14
    id: hvac_indoor_c
    internal: true
    filters:
      - lambda: return (x - 32.0f) * (5.0f / 9.0f);
  - platform: template
    id: m212063b02f14
    name: Indoor Temperature
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: m212063b02f33
    name: HVAC Mode Raw
    accuracy_decimals: 0
  - platform: template
    id: m212063b03f23
    name: HVAC Heat Setpoint
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: heat_pump_state
    name: Heat Pump State
    accuracy_decimals: 0
  - platform: template
    id: hvac_hour
    name: HVAC Hour
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_minute
    name: HVAC Minute
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_second
    name: HVAC Second
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_day
    name: HVAC Day
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_month
    name: HVAC Month
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_year
    name: HVAC Year (2-digit)
    internal: true
    accuracy_decimals: 0

  - platform: debug
    free:
      name: Atom Free Heap
    block:
      name: Atom Max Free Heap Block
    loop_time:
      name: Atom Loop Time
  - platform: uptime
    name: Atom Uptime
    type: seconds

text_sensor:
  - platform: template
    id: hvac_datetime
    name: HVAC Date and Time
    internal: true
    icon: mdi:calendar-clock
  - platform: debug
    reset_reason:
      name: Atom Reset Reason

bryant_parser:
  id: hvac_parser
  framer_id: hvac_framer
  datetime_text_id: hvac_datetime
  log_matches: true
  log_unmatched: false
  messages:
    - name: thermostat_time
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0202}
      payload_min: 6
    - name: thermostat_date
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0203}
      payload_min: 6
    - name: thermostat_status
      match: {dst: 0x21, src: 0x20, function: 0x06, register: 0x3B02}
      payload_min: 26
    - name: thermostat_heat_setpoint
      match: {dst: 0x21, src: 0x20, function: 0x06, register: 0x3B03}
      payload_min: 16
    - name: heat_pump_stage
      match: {dst: 0x20, src: 0x50, function: 0x06, register: 0x3E02}
      payload_min: 4
  fields:
    - {name: indoor_temp, message: thermostat_status, sensor_id: m212063b02f14, offset: 6}
    - {name: hvac_mode, message: thermostat_status, sensor_id: m212063b02f33, offset: 25}
    - {name: heat_setpoint, message: thermostat_heat_setpoint, sensor_id: m212063b03f23, offset: 15}
    - name: heat_pump_stage
      message: heat_pump_stage
      sensor_id: heat_pump_state
      offset: 3
      bit_rules:
        - {mask: 0x04, value: 2}
        - {mask: 0x02, value: 1}
      default: 0
    - {name: hour, message: thermostat_time, sensor_id: hvac_hour, offset: 3}
    - {name: minute, message: thermostat_time, sensor_id: hvac_minute, offset: 4}
    - {name: second, message: thermostat_time, sensor_id: hvac_second, offset: 5}
    - {name: day, message: thermostat_date, sensor_id: hvac_day, offset: 3}
    - {name: month, message: thermostat_date, sensor_id: hvac_month, offset: 4}
    - {name: year, message: thermostat_date, sensor_id: hvac_year, offset: 5}

# Native ESPHome datetime entity. Read-only: no set_action or optimistic state.
datetime:
  - platform: template
    id: hvac_native_datetime
    name: HVAC Date and Time (Native)
    type: datetime
    update_interval: 15s
    lambda: |-
      if (isnan(id(hvac_year).state) || isnan(id(hvac_month).state) ||
          isnan(id(hvac_day).state) || isnan(id(hvac_hour).state) ||
          isnan(id(hvac_minute).state) || isnan(id(hvac_second).state)) {
        return {};
      }
      ESPTime t{};
      t.year = 2000 + (int) id(hvac_year).state;
      t.month = (int) id(hvac_month).state;
      t.day_of_month = (int) id(hvac_day).state;
      t.hour = (int) id(hvac_hour).state;
      t.minute = (int) id(hvac_minute).state;
      t.second = (int) id(hvac_second).state;
      if (t.month < 1 || t.month > 12 || t.day_of_month < 1 ||
          t.day_of_month > 31 || t.hour > 23 || t.minute > 59 || t.second > 59)
        return {};
      return {t};

# Observational climate entity: frontend commands are ignored; nothing is sent.
climate:
  - platform: template
    id: bryant_climate
    name: Bryant HVAC Monitor
    sensor: hvac_indoor_c
    supported_modes: ["OFF", HEAT, COOL, AUTO]
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 50
      max_temperature: 90
      temperature_step: 1
    on_control:
      - logger.log: "Bryant climate is monitor-only; control ignored"
    initial_state:
      mode: "OFF"

# Read-only climate state reflects the parsed target.
# Avoid assigning a heating/cooling action until raw mode codes are confirmed.
interval:
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return !isnan(id(m212063b03f23).state);'
          then:
            - climate.template.publish:
                id: bryant_climate
                target_temperature: !lambda 'return (id(m212063b03f23).state - 32.0f) * (5.0f / 9.0f);'

# Manual raw-hex diagnostic transmission (no automatic CRC).
# Disabled by default; turn on the switch deliberately before pressing the button.
text:
  - platform: template
    id: hvac_tx_hex
    name: HVAC Raw TX Hex
    mode: text
    optimistic: true
    max_length: 530

switch:
  - platform: template
    id: hvac_tx_enabled
    name: HVAC Manual TX Enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

button:
  - platform: template
    name: HVAC Send Raw Frame
    on_press:
      - lambda: |-
          if (!id(hvac_tx_enabled).state) {
            ESP_LOGW("hvac_tx", "TX blocked: enable manual transmit first");
            return;
          }
          const std::string input = id(hvac_tx_hex).state;
          std::vector<uint8_t> bytes;
          int nibble = -1;
          for (char c : input) {
            if (c == ' ' || c == ':' || c == '-' || c == '\\t' ||
                c == '\\r' || c == '\\n') continue;
            int digit = -1;
            if (c >= '0' && c <= '9') digit = c - '0';
            else if (c >= 'a' && c <= 'f') digit = c - 'a' + 10;
            else if (c >= 'A' && c <= 'F') digit = c - 'A' + 10;
            if (digit < 0) {
              ESP_LOGW("hvac_tx", "Invalid hex character; no TX");
              return;
            }
            if (nibble < 0) nibble = digit;
            else {
              bytes.push_back((uint8_t) ((nibble << 4) | digit));
              nibble = -1;
            }
          }
          if (nibble >= 0 || bytes.size() < 10 || bytes.size() > 265) {
            ESP_LOGW("hvac_tx", "TX rejected: odd digits or invalid length");
            return;
          }
          if (bytes.size() != (size_t) bytes[4] + 10U) {
            ESP_LOGW("hvac_tx", "TX rejected: LEN does not match frame size");
            return;
          }
          id(hvac_uart).write_array(bytes.data(), bytes.size());
          ESP_LOGI("hvac_tx", "Sent %u raw bytes (CRC NOT verified)",
                   static_cast<unsigned>(bytes.size()));
          id(hvac_tx_enabled).turn_off();

debug:
  update_interval: 30s

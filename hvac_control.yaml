# Bryant HVAC observer + manual raw UART diagnostic transmit
esphome:
  name: bryant-hvac
  friendly_name: HVAC
  project: 
    name: 'chatgpt.bryant-hvac'
    version: '3.54
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Enable Home Assistant API
api:
  encryption:
    key: !secret hvac_atom_api_key

ota:
  - platform: esphome
    encryption:
    
# Wi-Fi settings
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  use_address: !secret hvac_atom_static_ip
  power_save_mode: none
  
udp:
  id: syslog_udp
  addresses: !secret syslog_ip
  port: !secret syslog_port

syslog:
  id: syslog_hvac
  udp_id: syslog_udp
  time_id: sntp_time
  port: 514
  level: DEBUG
  
select:
  - platform: template
    name: "Log Level"
    id: log_level_select
    icon: mdi:bug
    entity_category: diagnostic
    optimistic: true
    restore_value: false
    options:
      - "NONE"
      - "ERROR"
      - "WARN"
      - "INFO"
      - "DEBUG"
    initial_option: "DEBUG"
    set_action:
      - lambda: |-
          int level = ESPHOME_LOG_LEVEL_DEBUG;

          if (x == "NONE") level = ESPHOME_LOG_LEVEL_NONE;
          else if (x == "ERROR") level = ESPHOME_LOG_LEVEL_ERROR;
          else if (x == "WARN") level = ESPHOME_LOG_LEVEL_WARN;
          else if (x == "INFO") level = ESPHOME_LOG_LEVEL_INFO;
          else if (x == "DEBUG") level = ESPHOME_LOG_LEVEL_DEBUG;
          else if (x == "VERBOSE") level = ESPHOME_LOG_LEVEL_VERBOSE;
          else if (x == "VERY_VERBOSE") level = ESPHOME_LOG_LEVEL_VERY_VERBOSE;

          // Syslog has no public runtime setter; suppress messages at the source.
          // Syslog forwarding remains capped by syslog.level: DEBUG.
          id(hvac_logger).set_log_level(level);

logger:
  id: hvac_logger
  level: DEBUG
  baud_rate: 0

# SNTP Time Source
time:
  - platform: sntp
    id: sntp_time
    servers: 
      - 129.6.15.28
    timezone: "EST5EDT,M3.2.0,M11.1.0" #America/New_York
    on_time_sync: 
      then:
        - logger.log: "SNTP time synced"

external_components:
  - source:
      type: git
      url: https://github.com/natabled/bryantHVAC
    components: [bryant_framer, bryant_parser, bryant_writer, bryant_set]
    refresh: always
    
uart:
  id: hvac_uart
  tx_pin: GPIO19
  rx_pin: GPIO22
  baud_rate: 38400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 8192

bryant_framer:
  id: hvac_framer
  uart_id: hvac_uart
  drain_interval: 7ms
  ring_buffer_size: 2048
  max_payload_length: 200
  log_valid_frames: true
  log_frame_errors: true
  sync_timeout: 250ms
  sync_restarts_id: hvac_sync_restarts
  sync_acquisitions_id: hvac_sync_acquisitions
  sync_state_id: hvac_sync_state

# Pass 1: sensor IDs preserved for compatibility; group by logical device/function.
sensor:
  # ── THERMOSTAT · environmental and setpoint ──
  - platform: template
    id: tstat_indoor_temp
    name: "Tstat Indoor Temp"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: copy
    source_id: tstat_indoor_temp
    id: tstat_indoor_temp_c
    internal: true
    filters:
      - lambda: return (x - 32.0f) * (5.0f / 9.0f);
  - platform: template
    id: tstat_indoor_humidity
    name: "Tstat Indoor Humidity"
    unit_of_measurement: "%"
    device_class: humidity
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    id: tstat_outdoor_temp
    name: "Tstat Outdoor Temp"
    unit_of_measurement: "°F"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
  - platform: template
    id: tstat_heat_setpoint
    name: "Tstat Heat Setpoint"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0
  - platform: template
    id: tstat_cool_setpoint
    name: "Tstat Cool Setpoint"
    unit_of_measurement: "°F"
    device_class: temperature
    accuracy_decimals: 0

  # THERMOSTAT -- mode, operational policy
  - platform: template
    id: control_policy
    name: "Control Policy"
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      return id(atom_policy);

  - platform: template
    id: tstat_mode_raw
    name: "Tstat Mode Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: tstat_mode_raw_polled
    name: "Tstat Mode Raw Polled"
    accuracy_decimals: 0
    entity_category: diagnostic  

  - platform: template
    id: tstat_fan_mode_raw
    name: "Tstat Fan Mode Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: tstat_fan_speed_raw
    name: "Tstat Fan Speed Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: tstat_hold_mask_raw
    name: "Tstat Hold Mask Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: tstat_timed_hold_mask_raw
    name: "Tstat Timed Hold Mask Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: tstat_hold_minutes
    name: "Tstat Hold Minutes"
    unit_of_measurement: min
    icon: mdi:timer-outline
    accuracy_decimals: 0

  # ── FURNACE · stage and status ──
  - platform: template
    id: furnace_stage_requested
    name: "Furnace Stage Requested"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: furnace_stage_reported
    name: "Furnace Stage Reported"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: furnace_status_raw
    name: "Furnace Status Raw"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ── AIR HANDLER · blower telemetry ──
  - platform: template
    id: ahu_blower_rpm
    name: "AHU Blower RPM"
    unit_of_measurement: "rpm"
    icon: mdi:fan
    state_class: measurement
    accuracy_decimals: 0
  - platform: template
    id: ahu_operating_target_raw
    name: "AHU Operating Target Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: ahu_blower_status_raw
    name: "AHU Blower Status Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: ahu_blower_status_bit3_raw
    name: "AHU Blower Status Bit3 Raw"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ── HEAT PUMP · stage and status ──
  - platform: template
    id: heat_pump_stage_requested
    name: "Heat Pump Stage Requested"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: heat_pump_command_raw
    name: "Heat Pump Command Raw"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: heat_pump_active_reported
    name: "Heat Pump Active Reported"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ── ATOM · framer and internal clock ──
  - platform: template
    id: hvac_hour
    name: Hour
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_minute
    name: Minute
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_second
    name: Second
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_day
    name: Day
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_month
    name: Month
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_year
    name: Year
    internal: true
    accuracy_decimals: 0
  - platform: template
    id: hvac_sync_restarts
    name: "Framer Sync Restarts"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: hvac_sync_acquisitions
    name: "Framer Sync Acquisitions"
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    id: hvac_sync_state
    name: "Framer Synchronized"
    accuracy_decimals: 0
    entity_category: diagnostic

  # ── ATOM · debug and uptime ──
  - platform: debug
    free:
      name: Atom Free Heap
    block:
      name: Atom Max Free Heap Block
    loop_time:
      name: Atom Loop Time
  - platform: uptime
    name: Atom Uptime
    type: seconds

binary_sensor:
  # -- THERMOSTAT -- control bits
  - platform: template
    id: control_hold_owned
    name: "Control Hold Owned"
    entity_category: diagnostic
    lambda: |-
      return id(atom_owned_hold);
  #  update_interval: 1s

  # ── THERMOSTAT · demand bits and holds ──
  - platform: template
    id: tstat_demand_bit5
    name: "Tstat Demand Bit5"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(tstat_mode_raw).state)) return {};
      return (static_cast<int>(id(tstat_mode_raw).state) & 0x20) != 0;
  - platform: template
    id: tstat_demand_bit6
    name: "Tstat Demand Bit6"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(tstat_mode_raw).state)) return {};
      return (static_cast<int>(id(tstat_mode_raw).state) & 0x40) != 0;
  - platform: template
    id: tstat_hold_active
    name: "Tstat Hold Active"
    icon: mdi:hand-back-right
    lambda: |-
      if (isnan(id(tstat_hold_mask_raw).state)) return {};
      return (static_cast<uint8_t>(id(tstat_hold_mask_raw).state) & 0x01) != 0;
    entity_category: diagnostic
  - platform: template
    id: tstat_hold_timed
    name: "Tstat Hold Timed"
    icon: mdi:timer
    lambda: |-
      if (isnan(id(tstat_timed_hold_mask_raw).state)) return {};
      return (static_cast<uint8_t>(id(tstat_timed_hold_mask_raw).state) & 0x01) != 0;
    entity_category: diagnostic

  # ── FURNACE · 0404 diagnostic bits ──
  - platform: template
    id: furnace_status_bit0
    name: "Furnace Status Bit0"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(furnace_status_raw).state)) return {};
      return (static_cast<int>(id(furnace_status_raw).state) & 0x01) != 0;
  - platform: template
    id: furnace_status_bit1
    name: "Furnace Status Bit1"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(furnace_status_raw).state)) return {};
      return (static_cast<int>(id(furnace_status_raw).state) & 0x02) != 0;
  - platform: template
    id: furnace_status_bit2
    name: "Furnace Status Bit2"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(furnace_status_raw).state)) return {};
      return (static_cast<int>(id(furnace_status_raw).state) & 0x04) != 0;
  - platform: template
    id: furnace_status_bit3
    name: "Furnace Status Bit3"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(furnace_status_raw).state)) return {};
      return (static_cast<int>(id(furnace_status_raw).state) & 0x08) != 0;
  - platform: template
    id: furnace_status_bit4
    name: "Furnace Status Bit4"
    entity_category: diagnostic
    lambda: |-
      if (isnan(id(furnace_status_raw).state)) return {};
      return (static_cast<int>(id(furnace_status_raw).state) & 0x10) != 0;


text_sensor:
  # ── THERMOSTAT · decoded diagnostics ──
  - platform: template
    id: tstat_mode_decoded
    entity_category: diagnostic
    name: "Tstat Mode Decoded"
    icon: mdi:hvac
    lambda: |-
      if (isnan(id(tstat_mode_raw).state))
        return {"UNKNOWN"};

      switch (static_cast<int>(id(tstat_mode_raw).state)) {
        case 0:  return {"NO MODE"};
        case 32: return {"MODE 0x20"};
        case 64: return {"MODE 0x40"};
        case 96: return {"MODE 0x60"};
        default: return {"UNMAPPED"};
      }
  - platform: template
    id: tstat_fan_mode
    entity_category: diagnostic
    name: "Tstat Fan Mode"
    icon: mdi:fan
    lambda: |-
      if (isnan(id(tstat_fan_mode_raw).state)) return {"UNKNOWN"};
      switch (static_cast<int>(id(tstat_fan_mode_raw).state)) {
        case 0: return {"AUTO"};
        case 1: return {"LOW"};
        case 2: return {"MED"};
        case 3: return {"HIGH"}; // Expected sequence; not yet captured in 3B03.
        default: return {"UNKNOWN"};
      }

  # ── ATOM · clock and transaction diagnostics ──
  - platform: template
    id: hvac_datetime
    name: Date and Time
    icon: mdi:calendar-clock
  - platform: template
    id: hvac_set_status
    name: Set Transaction Status
    icon: mdi:check-circle-outline
    
  # DEBUG

  # ── ATOM · debug ──
  - platform: debug
    reset_reason:
      name: Atom Reset Reason

bryant_parser:
  id: hvac_parser
  framer_id: hvac_framer
  datetime_text_id: hvac_datetime
  log_matches: true
  log_unmatched: false
  messages:
    # ── THERMOSTAT 0x20 · status, configuration, and broadcasts ──
    # 0202 · broadcasts current time for other system devices [inferred; not Bryant documentation]
    - name: tstat_0202_command
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0202}
      payload_min: 6
    # 0203 · broadcasts current date for other system devices [inferred; not Bryant documentation]
    - name: tstat_0203_command
      log: false
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0203}
      payload_min: 6
    # 0420 · distributes outdoor temperature and indoor humidity readings [inferred; not Bryant documentation]
    - name: tstat_0420_broadcast
      log: true
      match: {dst: 0xF1, src: 0x20, function: 0x0C, register: 0x0420}
      payload_min: 22
    # 3B02 · returns thermostat zone status, temperature, and demand-related flags [inferred; not Bryant documentation]
    - name: tstat_3b02_response
      log: true
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B02}
      payload_min: 26
    # 3B03 · returns zone setpoints, fan settings, and hold/override data [inferred; not Bryant documentation]
    - name: tstat_3b03_response
      log: true
      match: {dst: 0x92, src: 0x20, function: 0x06, register: 0x3B03}
      payload_min: 43

    # ── FURNACE / AHU 0x40 · stage and blower telemetry ──
    # 0306 · reports blower speed, stage-correlated target, and AHU flags [inferred; not Bryant documentation]
    # 0305 · Thermostat requests furnace heat level (0=off, 1=low, 2=medium; 3 unverified).
    - name: furnace_0305_command
      log: true
      match: {dst: 0x40, src: 0x20, function: 0x0C, register: 0x0305}
      payload_min: 4
    - name: furnace_0306_response
      log: true
      match: {dst: 0x20, src: 0x40, function: 0x06, register: 0x0306}
      payload_min: 13
    # 0316 · reports furnace stage and associated operating values [inferred; not Bryant documentation]
    - name: furnace_0316_response
      log: true
      match: {dst: 0x20, src: 0x40, function: 0x06, register: 0x0316}
      payload_min: 17
    # 0404 · reports furnace operating flags and additional blower/thermal telemetry [inferred; not Bryant documentation]
    - name: furnace_0404_response
      match: {dst: 0x20, src: 0x40, function: 0x06, register: 0x0404}
      payload_min: 21

    # ── HEAT PUMP 0x50 · staging and outdoor-unit status ──
    # 0502 · reports outdoor-unit active indication and status bytes [inferred; not Bryant documentation]
    - name: heat_pump_0502_response
      match: {dst: 0x20, src: 0x50, function: 0x06, register: 0x0502}
      payload_min: 8
    # 3E01 · reports outdoor-unit telemetry or configuration (meaning unverified) [inferred; not Bryant documentation]
    - name: heat_pump_3e01_response
      log: true
      match: {dst: 0x20, src: 0x50, function: 0x06, register: 0x3E01}
      payload_min: 16
    # 3E02 · commands the heat-pump operating stage [inferred; not Bryant documentation]
    - name: heat_pump_3e02_command
      log: false
      match: {dst: 0x50, src: 0x20, function: 0x0C, register: 0x3E02}
      payload_min: 4

  fields:
    # ── THERMOSTAT · 0202 time ──
    - {name: hour, message: tstat_0202_command, sensor_id: hvac_hour, offset: 3}
    - {name: minute, message: tstat_0202_command, sensor_id: hvac_minute, offset: 4}
    - {name: second, message: tstat_0202_command, sensor_id: hvac_second, offset: 5}

    # ── THERMOSTAT · 0203 date ──
    - {name: day, message: tstat_0203_command, sensor_id: hvac_day, offset: 3}
    - {name: month, message: tstat_0203_command, sensor_id: hvac_month, offset: 4}
    - {name: year, message: tstat_0203_command, sensor_id: hvac_year, offset: 5}

    # ── THERMOSTAT · 0420 environmental ──
    - {name: indoor_humidity, message: tstat_0420_broadcast, sensor_id: tstat_indoor_humidity, offset: 13}
    - {name: tstat_mode_raw, message: tstat_0420_broadcast, sensor_id: tstat_mode_raw, offset: 12}
    - name: outdoor_temp
      message: tstat_0420_broadcast
      sensor_id: tstat_outdoor_temp
      offset: 9
      width: 16
      endian: big
      signed: true
      multiplier: 0.0625

    # ── THERMOSTAT · 3B02 status ──
    - {name: indoor_temp, message: tstat_3b02_response, sensor_id: tstat_indoor_temp, offset: 6}
    - {name: tstat_mode_polled, message: tstat_3b02_response, sensor_id: tstat_mode_raw_polled, offset: 25}

    # ── THERMOSTAT · 3B03 setpoints, fan and holds ──
    - {name: heat_setpoint, message: tstat_3b03_response, sensor_id: tstat_heat_setpoint, offset: 15}
    - {name: cool_setpoint, message: tstat_3b03_response, sensor_id: tstat_cool_setpoint, offset: 23}
    - {name: fan_mode, message: tstat_3b03_response, sensor_id: tstat_fan_mode_raw, offset: 6}
    - {name: fan_speed, message: tstat_3b03_response, sensor_id: tstat_fan_speed_raw, offset: 39}
    - {name: zones_holding, message: tstat_3b03_response, sensor_id: tstat_hold_mask_raw, offset: 14}
    - {name: timed_holds, message: tstat_3b03_response, sensor_id: tstat_timed_hold_mask_raw, offset: 40}
    - {name: override_minutes, message: tstat_3b03_response, sensor_id: tstat_hold_minutes, offset: 41, width: 16, endian: big}

    # ── FURNACE / AHU · 0306 blower and operating values ──
    - name: furnace_stage_requested
      message: furnace_0305_command
      sensor_id: furnace_stage_requested
      offset: 3

    - name: ahu_rpm
      message: furnace_0306_response
      sensor_id: ahu_blower_rpm
      offset: 4
      width: 16
      endian: big
    - name: ahu_operating_target_raw
      message: furnace_0306_response
      sensor_id: ahu_operating_target_raw
      offset: 6
      width: 16
      endian: big
    - name: furnace_0306_flags
      message: furnace_0306_response
      sensor_id: ahu_blower_status_raw
      offset: 12
    - name: furnace_0306_bit3
      message: furnace_0306_response
      sensor_id: ahu_blower_status_bit3_raw
      offset: 12
      mask: 0x08
      shift: 3

    # ── FURNACE · 0316 reported stage ──
    - name: furnace_stage_reported
      message: furnace_0316_response
      sensor_id: furnace_stage_reported
      offset: 3

    # ── FURNACE · 0404 status flags ──
    - name: furnace_flags
      message: furnace_0404_response
      sensor_id: furnace_status_raw
      offset: 6

    # ── HEAT PUMP · 0502 equipment status ──
    - name: hp_equipment_active
      message: heat_pump_0502_response
      sensor_id: heat_pump_active_reported
      offset: 4

# Read-only date/time is published by bryant_parser to text_sensor.hvac_datetime.
# Native datetime template with lambda is not used because it expects a writable
# or optimistic configuration. The six raw date/time sensors stay internal.

    # ── HEAT PUMP · 3E02 stage command ──
    - name: heat_pump_stage
      message: heat_pump_3e02_command
      sensor_id: heat_pump_stage_requested
      offset: 3
      bit_rules:
        - {mask: 0x04, value: 2}
        - {mask: 0x02, value: 1}
      default: 0
    - name: hp_command_raw
      message: heat_pump_3e02_command
      sensor_id: heat_pump_command_raw
      offset: 3

  # Read-only date/time is published to text_sensor.hvac_datetime.
  # Six raw date/time sensors remain internal; no datetime template lambda.

bryant_writer:
  id: hvac_writer
  uart_id: hvac_uart
  framer_id: hvac_framer
  idle_ms: 50
  poll_interval: 50s
  log_tx: true
  responder:
    enabled: true
    address: 0x92
    register: 0x3B0E
    window: 5s
  polls:
    - name: thermostat_status
      frame: "20 01 92 01 03 00 00 0B 00 3B 02 2D 7A"
      offset_ms: 0
    - name: thermostat_heat_setpoint
      frame: "20 01 92 01 03 00 00 0B 00 3B 03 EC BA"
      offset_ms: 350

# Setpoint transactions: fresh 3B03 read -> write -> verify.
# No automatic write retries. Climate remains monitor-only for initial testing.
bryant_set:
  id: hvac_set
  framer_id: hvac_framer
  writer_id: hvac_writer
  status_text_id: hvac_set_status
  thermostat_address: 0x20
  sam_address: 0x92
  timeout: 15s
  verify_delay: 500ms

number:
  - platform: template
    id: zone1_heat_request
    name: Heat Test Request
    min_value: 50
    max_value: 90
    step: 1
    unit_of_measurement: "°F"
    optimistic: true
    initial_value: 66
    restore_value: false
  - platform: template
    id: auto_set
    name: "Auto Setpoint"
    icon: mdi:thermometer-chevron-up
    unit_of_measurement: "°F"
    device_class: temperature
    entity_category: config
    min_value: 50
    max_value: 86
    step: 1
    optimistic: false
    update_interval: 5s

    lambda: |-
      return id(tstat_heat_setpoint).state;

    set_action:
      - lambda: |-
          // Legacy Auto Setpoint control: valid only in Bryant-owned HEAT.
          if (id(atom_policy) != 1) {
            ESP_LOGW("atom_climate", "Auto Setpoint rejected: Atom is not in Bryant-control policy");
            return;
          }

          if (isnan(id(tstat_mode_raw).state) ||
            static_cast<int>(id(tstat_mode_raw).state) != 0) {
            ESP_LOGW("atom_climate",
                     "AUTO override rejected: thermostat not in HEAT");
            return;
          }

          if (id(tstat_hold_active).state) {
            ESP_LOGW("atom_climate",
                     "AUTO override rejected: permanent HOLD active");
            return;
          }
          
          const int target = static_cast<int>(lroundf(x));

          // Latest request wins; bus transaction starts after 1s of quiet.
          id(atom_target_f) = target;
          id(atom_target_pending) = true;
          id(atom_target_changed_at) = millis();
          ESP_LOGI("atom_climate", "AUTO override queued: %dF", target);

# Pass A: Bryant mode is authoritative for climate.mode (0420: 0 HEAT, 1 COOL, 5 OFF).
# atom_policy is LEGACY ownership policy only: 0 inactive/off, 1 Bryant,
# 2 supervisor-owned HOLD. It is not published as the climate HVAC mode.
# No mode-write or new supervisor switch is introduced in Pass A.
# The existing heat setpoint transaction and HOLD reconciliation are preserved.
globals:
  - id: atom_policy
    type: int
    restore_value: no
    initial_value: '0'  # 0 OFF, 1 AUTO, 2 HEAT; COOL reserved
  - id: atom_owned_hold
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_hold_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_hold_requested_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: atom_release_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_target_pending
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: atom_target_f
    type: int
    restore_value: no
    initial_value: '66'
  - id: atom_target_changed_at
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: atom_last_hold_update
    type: uint32_t
    restore_value: no
    initial_value: '0'
  - id: atom_last_hold_seen
    type: bool
    restore_value: no
    initial_value: 'false'

climate:
  - platform: template
    id: bryant_climate
    name: Bryant Climate
    sensor: tstat_indoor_temp_c
    supported_modes: ["OFF", HEAT, COOL]
    supports_current_temperature: true
    supports_two_point_target_temperature: false
    optimistic: false
    restore_mode: NO_RESTORE
    visual:
      min_temperature: 10  # 50F
      max_temperature: 30  # 86F
      temperature_step: 1
    initial_state:
      mode: "OFF"
    on_control:
      - lambda: |-
          const float raw = id(tstat_mode_raw).state;
          const int thermostat_mode = isnan(raw) ? -1 : static_cast<int>(raw);
          // Physical mode changes are not implemented on the Bryant bus.
          // Do NOT use climate mode buttons to request or release HOLD.
          if (x.get_mode().has_value()) {
            ESP_LOGW("atom_climate", "Mode change rejected: Bryant mode-write unverified; change mode at thermostat");
          }
          if (x.get_target_temperature().has_value()) {
            const int f = static_cast<int>(lroundf(x.get_target_temperature().value() * 9.0f / 5.0f + 32.0f));
            if (f >= 50 && f <= 86 && thermostat_mode == 0 &&
                (id(atom_policy) == 1 || id(atom_policy) == 2) &&
                !(id(atom_policy) == 1 &&
                  (isnan(id(tstat_hold_mask_raw).state) ||
                   (static_cast<uint8_t>(id(tstat_hold_mask_raw).state) & 1)))) {
              // Bryant owner: temporary override (~120 min). Supervisor owner:
              // setpoint changes preserve the already-confirmed Atom-owned HOLD.
              id(atom_target_f) = f;
              id(atom_target_pending) = true;
              id(atom_target_changed_at) = millis();
              ESP_LOGI("atom_climate", "Queued %s heat target %dF", id(atom_policy) == 1 ? "Bryant temporary override" : "supervisor HOLD", f);
            } else {
              ESP_LOGW("atom_climate", "Setpoint rejected: only HEAT-selected thermostat supported by writer");
            }
          }

# Reconcile from *fresh* parser values, not merely a 5s timer. No write retries.
# Polls of 3B02/3B03 remain 50s; changing the manual HOLD may take one poll to appear.
interval:
  - interval: 250ms
    then:
      - lambda: |-
          const float mode_raw = id(tstat_mode_raw).state;
          const int tmode = isnan(mode_raw) ? -1 : static_cast<int>(mode_raw);
          const bool have_hold = !isnan(id(tstat_hold_mask_raw).state);
          const bool hold = have_hold && ((static_cast<uint8_t>(id(tstat_hold_mask_raw).state) & 1) != 0);
          const bool timed = !isnan(id(tstat_timed_hold_mask_raw).state) &&
              ((static_cast<uint8_t>(id(tstat_timed_hold_mask_raw).state) & 1) != 0);
          const bool busy = id(hvac_set).is_busy();
          // Startup/observation: OFF if thermostat OFF; AUTO if HEAT or COOL.
          // Unknown mode never implies permission to write.
          if (tmode == 5) {
            if (id(atom_policy) == 2) {
              ESP_LOGW("atom_climate", "Thermostat turned OFF; Atom relinquishing control");
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
              id(atom_release_pending) = false;
            }
            id(atom_policy) = 0;
          } else if (tmode == 0 || tmode == 1) {
            if (id(atom_policy) == 0) id(atom_policy) = 1;
            if (id(atom_policy) == 2 && tmode != 0) {
              ESP_LOGW("atom_climate", "Thermostat left HEAT; Atom relinquishing control");
              id(atom_policy) = 1;
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
              id(atom_release_pending) = false;
            }
          }
          if (id(atom_policy) == 2 && tmode == 0 && have_hold && !busy) {
            if (id(atom_owned_hold) && (!hold || timed)) {
              ESP_LOGW("atom_climate", "Operator removed/changed Atom HOLD; returning to AUTO");
              id(atom_policy) = 1;
              id(atom_owned_hold) = false;
              id(atom_hold_pending) = false;
              id(atom_target_pending) = false;
            } else if (id(atom_hold_pending)) {
              if (hold && !timed) {
                id(atom_owned_hold) = true;
                id(atom_hold_pending) = false;
                ESP_LOGI("atom_climate", "Atom HOLD confirmed");
              } else if ((uint32_t)(millis() - id(atom_hold_requested_at)) > 20000) {
                ESP_LOGW("atom_climate", "HOLD not confirmed; returning to AUTO");
                id(atom_policy) = 1;
                id(atom_hold_pending) = false;
                id(atom_target_pending) = false;
              }
            } else if (!id(atom_owned_hold)) {
              if (hold && !timed) {
                // Do not silently adopt an operator's pre-existing manual HOLD.
                ESP_LOGW("atom_climate", "Manual HOLD already active; Atom ownership not established; returning to AUTO");
                id(atom_policy) = 1;
                id(atom_target_pending) = false;
              } else if (id(hvac_set).set_hold(1, true)) {
                id(atom_hold_pending) = true;
                id(atom_hold_requested_at) = millis();
              }
            }
          }
          if (id(atom_release_pending) && !busy && have_hold) {
            if (hold && id(atom_owned_hold)) {
              if (id(hvac_set).set_hold(1, false)) id(atom_release_pending) = false;
            } else id(atom_release_pending) = false;
            id(atom_owned_hold) = false;
          }
          // Debounce both climate and number input; do not drop edits while busy.
          if (id(atom_target_pending) &&
              (uint32_t)(millis() - id(atom_target_changed_at)) >= 1000 &&
              !busy && tmode == 0 &&
              (id(atom_policy) == 1 || (id(atom_policy) == 2 && id(atom_owned_hold))) &&
              !(id(atom_policy) == 1 && (!have_hold || hold))) {
            if (id(hvac_set).set_heat(1, static_cast<uint8_t>(id(atom_target_f)))) {
              id(atom_target_pending) = false;
            }
          }
  - interval: 5s
    then:
      - climate.template.publish:
          id: bryant_climate
          mode: !lambda |-
            // Bryant-selected physical mode from unpolled 0420, never atom_policy.
            const float raw = id(tstat_mode_raw).state;
            if (isnan(raw)) return id(bryant_climate).mode;
            switch (static_cast<int>(raw)) {
              case 0: return climate::CLIMATE_MODE_HEAT;
              case 1: return climate::CLIMATE_MODE_COOL;
              case 5: return climate::CLIMATE_MODE_OFF;
              default:
                ESP_LOGW("atom_climate", "Unknown Bryant mode: %.0f", raw);
                return id(bryant_climate).mode;
            }
          action: !lambda |-
            const float raw = id(tstat_mode_raw).state;
            if (isnan(raw)) return climate::CLIMATE_ACTION_OFF;
            const int mode = static_cast<int>(raw);
            if (mode == 5) return climate::CLIMATE_ACTION_OFF;
            if (mode != 0 && mode != 1) return climate::CLIMATE_ACTION_OFF;
            const float furnace = id(furnace_stage_reported).state;
            const float hp = id(heat_pump_active_reported).state;
            if (mode == 0 && ((!isnan(furnace) && furnace > 0) ||
                              (!isnan(hp) && hp > 0))) {
              return climate::CLIMATE_ACTION_HEATING;
            }
            // Cooling action is not yet confirmed by a dedicated bus signal.
            return climate::CLIMATE_ACTION_IDLE;
          target_temperature: !lambda |-
            const float raw = id(tstat_mode_raw).state;
            if (isnan(raw)) return NAN;
            const int mode = static_cast<int>(raw);
            const float f = (mode == 1) ? id(tstat_cool_setpoint).state
                                       : id(tstat_heat_setpoint).state;
            return isnan(f) ? NAN : (f - 32.0f) * 5.0f / 9.0f;

# Manual raw-hex diagnostic transmission (CRC and length verified by writer).
# Disabled by default; turn on the switch deliberately before pressing the button.
text:
  - platform: template
    id: hvac_tx_hex
    name: Raw TX Hex
    mode: text
    optimistic: true
    max_length: 250
  - platform: template
    id: log_observer
    name: Log Observer
    mode: TEXT
    optimistic: true
    max_length: 128
    on_value:
      then:
        - logger.log:
            format: "OBSERVER %s"
            args: ["x.c_str()"]
            
switch:
  - platform: template
    id: hvac_tx_enabled
    name: Manual TX Enabled
    optimistic: true
    restore_mode: ALWAYS_OFF
    entity_category: config

button:
  - platform: template
    name: Hold Set
    on_press:
      - lambda: |-
          id(hvac_set).set_hold(1, true);
  - platform: template
    name: Hold Clear
    on_press:
      - lambda: |-
          id(hvac_set).set_hold(1, false);
  - platform: template
    name: Heat Test Send
    on_press:
      - lambda: |-
          id(hvac_set).set_heat(1, static_cast<uint8_t>(id(zone1_heat_request).state));
  - platform: template
    name: Raw TX Send
    on_press:
      - lambda: |-
          if (!id(hvac_tx_enabled).state) {
            ESP_LOGW("hvac_tx", "TX blocked: manual transmit disabled");
            return;
          }
          const bool accepted = id(hvac_writer).enqueue_hex(id(hvac_tx_hex).state);
          if (accepted) {
            ESP_LOGI("hvac_tx", "Manual frame queued; awaiting bus idle");
            id(hvac_tx_enabled).turn_off();
          }

debug:
  update_interval: 30s
